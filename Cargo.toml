[workspace]
members = ["crates/actuation-core", "crates/actuation-runtime", "crates/actuation-stream", "crates/actuation-adapters", "crates/actuation-research"]
resolver = "2"

[workspace.package]
version = "0.2.0"
edition = "2021"
publish = false
repository = "https://github.com/EpiLogos/Actuation"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
lto = "thin"
strip = "debuginfo"
