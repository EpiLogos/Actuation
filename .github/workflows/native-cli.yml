name: Native CLI

# The one pull-request gate for Actuation (branch-required). `npm test`
# discovers every native suite; the contract schemas are parsed here, so the
# per-contract workflows that only re-ran `npm test` are gone.

on:
  # This check is branch-required, so it must report on every pull request.
  # Push builds remain path-scoped below to avoid redundant mainline work.
  pull_request:
  push:
    branches:
      - main
    paths:
      - "bin/actuation"
      - "cli/**"
      - "contracts/**"
      - "detection/**"
      - "package.json"
      - "README.md"
      - ".oi/product.json"
      - "ProjectCentral/**"
      - "docs/EPISTEMIC-CULTIVATION-AND-MODEL-INTERIOR-RESEARCH.md"
      - "docs/MODEL-BEARING-AGENCY-RESEARCH-AND-MATERIALISATION.md"
      - "experiments/epistemic-cultivation/**"
      - ".github/workflows/native-cli.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-cli:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # npm test globs every native suite; a hardcoded file list here rots
      # (it referenced contracts/model-bearing.test.mjs after the rename).
      - run: npm test
      - run: node --test ProjectCentral/tests/register.integrity.mjs
      - name: Every contract schema parses
        run: |
          for schema in contracts/*.schema.json; do
            node -e 'JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"))' "$schema"
          done
      - name: Self-certification - the served binary certifies this build
        run: |
          node bin/actuation capabilities --json > capabilities.json
          node <<'NODE'
          const assert = require("node:assert/strict");
          const caps = require("./capabilities.json");
          const pkg = require("./package.json");
          assert.equal(caps.version, pkg.version, "served version must equal package.json");
          assert.equal(caps.revision, process.env.GITHUB_SHA, "served revision must be the build sha");
          assert.ok(caps.commands.length >= 1, "capabilities must declare the command surface");
          console.log(`self-certified actuation ${caps.version} @ ${caps.revision.slice(0, 12)} (${caps.commands.length} commands)`);
          NODE
      - name: Packaging parity - product manifest tracks the package version
        run: |
          node <<'NODE'
          const assert = require("node:assert/strict");
          const product = require("./.oi/product.json");
          const pkg = require("./package.json");
          assert.equal(product.version, pkg.version, ".oi/product.json version must equal package.json");
          console.log(`packaging parity: .oi/product.json ${product.version} == package.json ${pkg.version}`);
          NODE
      - run: ./bin/actuation --version
      - run: ./bin/actuation capabilities --json
      - run: ./bin/actuation verify --json
