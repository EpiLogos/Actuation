name: Native CLI

on:
  pull_request:
    paths:
      - "bin/actuation"
      - "cli/**"
      - "contracts/**"
      - "detection/**"
      - "package.json"
      - ".oi/product.json"
      - ".github/workflows/native-cli.yml"
  push:
    branches:
      - main
    paths:
      - "bin/actuation"
      - "cli/**"
      - "contracts/**"
      - "detection/**"
      - "package.json"
      - ".oi/product.json"
      - ".github/workflows/native-cli.yml"

jobs:
  native-cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # npm test globs every native suite; a hardcoded file list here rots
      # (it referenced contracts/model-bearing.test.mjs after the rename).
      - run: npm test
      - run: ./bin/actuation --version
      - run: ./bin/actuation capabilities --json
      - run: ./bin/actuation verify --json
