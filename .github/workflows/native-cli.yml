name: Native CLI

# The one pull-request gate for Actuation (branch-required). The served product
# is the native Rust executable; `cargo test --workspace` runs every native
# suite and `actuation verify --json` exercises the shipped binary itself. The
# product requires no Node runtime. macOS coverage rides the native-rust matrix
# in rust-refoundation.yml, which runs the same verification script.

on:
  # This check is branch-required, so it must report on every pull request.
  # Push builds remain path-scoped below to avoid redundant mainline work.
  pull_request:
  push:
    branches:
      - main
    paths:
      - "crates/**"
      - "catalog/**"
      - "schemas/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "scripts/migration/**"
      - "README.md"
      - ".oi/product.json"
      - "ProjectCentral/**"
      - ".github/workflows/native-cli.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-cli:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Native suites and frozen parity oracles
        run: bash scripts/migration/verify-native.sh native-evidence
      - name: R7 gate - the served executable answers the product surface
        run: |
          set -euo pipefail
          actuation="target/release/actuation"
          "$actuation" --version
          "$actuation" help > /dev/null
          "$actuation" capabilities --json > /dev/null
          "$actuation" contract list --json > /dev/null
          "$actuation" harness catalog --json > /dev/null
          "$actuation" system --json > /dev/null
          echo '{"binding":{"schema":"actuation.agency/v1","binding_ref":"world-binding:ci","agent_ref":"agent:ci","agency_ref":"agency:ci","world_ref":"world:ci","scope_ref":"scope:ci"}}' | "$actuation" agency - --json > /dev/null
          "$actuation" verify --json
      - name: Self-certification - the served binary certifies this build
        run: |
          set -euo pipefail
          target/release/actuation capabilities --json > capabilities.json
          workspace_version="$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json,sys; print([p for p in json.load(sys.stdin)["packages"] if p["name"]=="actuation-cli"][0]["version"])')"
          python3 - <<PY
          import json, os
          caps = json.load(open("capabilities.json"))
          assert caps["version"] == "$workspace_version", "served version must equal the workspace version"
          assert caps["revision"] == os.environ["GITHUB_SHA"], "served revision must be the build sha"
          assert len(caps["commands"]) >= 1, "capabilities must declare the command surface"
          print(f"self-certified actuation {caps['version']} @ {caps['revision'][:12]} ({len(caps['commands'])} commands)")
          PY
      - name: Packaging parity - product manifest tracks the workspace version
        run: |
          set -euo pipefail
          workspace_version="$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json,sys; print([p for p in json.load(sys.stdin)["packages"] if p["name"]=="actuation-cli"][0]["version"])')"
          python3 - <<PY
          import json
          product = json.load(open(".oi/product.json"))
          assert product["version"] == "$workspace_version", ".oi/product.json version must equal the workspace version"
          print(f"packaging parity: .oi/product.json {product['version']} == workspace {product['version']}")
          PY
      - name: Every public schema parses
        run: |
          for schema in schemas/*.json; do
            python3 -c 'import json,sys; json.load(open(sys.argv[1]))' "$schema"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: actuation-native-cli-${{ github.sha }}
          path: native-evidence/
          if-no-files-found: error
          retention-days: 30
