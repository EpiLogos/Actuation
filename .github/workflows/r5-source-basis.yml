name: R5 source basis
on:
  push:
    branches: [act-rust/r5-observation-adapters]
    paths: [.github/workflows/r5-source-basis.yml]
permissions:
  contents: read
jobs:
  exact-source-basis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Preserve the actual programme and owner cuts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/r5-source-basis"
          python3 - <<'PY'
          import hashlib, json, os, pathlib, urllib.request
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'r5-source-basis'
          def read(path):
              req = urllib.request.Request('https://api.github.com/repos/EpiLogos/' + path, headers={'Accept':'application/vnd.github+json', 'User-Agent':'Actuation-source-basis', 'Authorization':'Bearer '+os.environ['GH_TOKEN']})
              with urllib.request.urlopen(req, timeout=60) as response:
                  return response.read()
          for repo, numbers in [('Actuation',[58]), ('O-I',[220,213,201]), ('Factory',[195])]:
              for number in numbers:
                  issue = json.loads(read(f'{repo}/issues/{number}'))
                  (root / f'{repo}-issue-{number}.json').write_text(json.dumps(issue, indent=2))
                  (root / f'{repo}-issue-{number}.md').write_text(issue.get('body') or '')
                  pages = []
                  page = 1
                  while True:
                      comments = json.loads(read(f'{repo}/issues/{number}/comments?per_page=100&page={page}'))
                      pages.extend(comments)
                      if len(comments) < 100: break
                      page += 1
                  (root / f'{repo}-issue-{number}-comments.json').write_text(json.dumps(pages, indent=2))
          cuts = {}
          for repo in ['O-I', 'QL-MEF', 'ai-kit', 'Factory', 'Workcell']:
              ref = json.loads(read(f'{repo}/git/ref/heads/main'))
              sha = ref['object']['sha']
              cuts[repo] = sha
              data = read(f'{repo}/tarball/{sha}')
              (root / f'{repo}-{sha}.tar.gz').write_bytes(data)
          (root / 'owner-cuts.json').write_text(json.dumps(cuts, indent=2))
          (root / 'SHA256SUMS').write_text(''.join(hashlib.sha256(p.read_bytes()).hexdigest()+'  '+p.name+'\n' for p in sorted(root.iterdir()) if p.is_file()))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: actuation-r5-current-source-basis
          path: ${{ runner.temp }}/r5-source-basis/
          if-no-files-found: error
          retention-days: 30
