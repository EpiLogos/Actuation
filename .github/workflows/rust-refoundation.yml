name: Rust refoundation

# The native gate across both release targets: fmt, clippy -D warnings, the
# full workspace test suite, examples/bins and the release-binary
# `actuation verify` certification. The frozen Node-era compatibility oracle
# and its replay gate (actuation-migration-gate) were retired in
# cleanup/retire-node-oracle-2026-09-22 — the product's own contract,
# conformance and verify suites are the standing acceptance. The served
# product, the Skills check and the research suites already run in
# native-cli.yml, native-skills.yml and the experiment workflows; they are
# not repeated here.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Native constitutional domain, executable parity, process custody and CLI cutover
        env:
          ACTUATION_NATIVE_REQUESTED_SOURCE: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          bash scripts/migration/verify-native.sh native-evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: actuation-native-${{ runner.os }}-${{ github.sha }}
          path: native-evidence/
          if-no-files-found: error
          retention-days: 30
          # Only controlled ordinary evidence and actual image copies. Original
          # retained fixtures/private captures are outside this upload root.
          include-hidden-files: true
