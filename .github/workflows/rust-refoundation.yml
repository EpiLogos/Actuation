name: Rust refoundation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  migration-oracle:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Preserve exact source basis
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p migration-evidence
          git rev-parse HEAD > migration-evidence/source-commit.txt
          git ls-tree -r HEAD > migration-evidence/source-tree.txt
          git archive --format=tar.gz HEAD > migration-evidence/source.tar.gz
          sha256sum migration-evidence/source.tar.gz > migration-evidence/source.tar.gz.sha256
      - name: Existing native product and Skills
        shell: bash
        run: |
          set -euo pipefail
          npm test | tee migration-evidence/node-native-tests.log
          node bin/actuation verify --json | tee migration-evidence/node-verify.json
          bash scripts/verify-native-skills.sh | tee migration-evidence/native-skills.log
      - name: Research programmes remain active
        shell: bash
        run: |
          set -euo pipefail
          node --test experiments/ql-runtime/foundation/test/*.test.js experiments/ql-runtime/deep-ql/test/*.test.js experiments/ql-runtime/prime/test/*.test.mjs experiments/epistemic-cultivation/test/*.test.mjs | tee migration-evidence/research-tests.log
          python3 -m py_compile experiments/ql-runtime/prime/skills/ql-relational/src/ql_relational/__init__.py experiments/ql-runtime/comparison/series1/pydantic_bridge.py
      - name: Enforce frozen compatibility oracle (never recapture in a passing gate)
        shell: bash
        run: |
          set -euo pipefail
          node --test scripts/migration/recorder.test.mjs
          node scripts/migration/verify-corpus.mjs | tee migration-evidence/corpus-integrity.json
          node scripts/migration/parity.mjs | tee migration-evidence/pure-parity.json
          node scripts/migration/scenario-parity.mjs | tee migration-evidence/scenario-parity.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: actuation-migration-evidence-${{ github.sha }}
          path: migration-evidence/
          if-no-files-found: error
          retention-days: 30

  # One-time deterministic code generation on the sole draft R0/R1 branch.
  # This is not an agent and changes no product source. Remove before PR A
  # acceptance. A normal passing gate only reads the immutable corpus.
  capture-once:
    if: github.event_name == 'pull_request' && github.head_ref == 'act-rust/r0-r1-oracle' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate once from locked original sources and commit only frozen data
        shell: bash
        run: |
          set -euo pipefail
          if test -e fixtures/migration/oracle.json; then
            echo 'Corpus already frozen; refusing automatic recapture.'
            exit 0
          fi
          mkdir -p fixtures/migration docs/rust-refoundation
          node --test scripts/migration/recorder.test.mjs
          node scripts/migration/build-ledger.mjs docs/rust-refoundation/ledger.json
          node scripts/migration/capture.mjs fixtures/migration/oracle.json
          node scripts/migration/capture-scenarios.mjs fixtures/migration/oracle.json fixtures/migration/scenarios.json
          node experiments/ql-runtime/foundation/fixtures/run-foundation-gate.mjs > fixtures/migration/foundation.json
          sha256sum fixtures/migration/oracle.json fixtures/migration/scenarios.json fixtures/migration/foundation.json docs/rust-refoundation/ledger.json > fixtures/migration/SHA256SUMS
          node scripts/migration/verify-corpus.mjs
          node scripts/migration/parity.mjs
          node scripts/migration/scenario-parity.mjs
          git add -- fixtures/migration/oracle.json fixtures/migration/scenarios.json fixtures/migration/foundation.json fixtures/migration/SHA256SUMS docs/rust-refoundation/ledger.json
          test "$(git diff --cached --name-only | wc -l)" -eq 5
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m '[ACT-RUST R1] Freeze exact-source compatibility corpus and file-level migration ledger'
          git push origin HEAD:refs/heads/act-rust/r0-r1-oracle
      - name: Preserve generated candidate for inspection
        if: always()
        shell: bash
        run: |
          mkdir -p capture-evidence
          git rev-parse HEAD > capture-evidence/source-commit.txt
          git archive --format=tar.gz HEAD > capture-evidence/source.tar.gz
          if test -d fixtures/migration; then cp -R fixtures/migration capture-evidence/fixtures; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: actuation-r1-capture-${{ github.event.pull_request.head.sha }}
          path: capture-evidence/
          if-no-files-found: error
          retention-days: 30
