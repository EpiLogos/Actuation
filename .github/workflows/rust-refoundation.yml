name: Rust refoundation

# Unique obligations only: the frozen compatibility oracle and the native
# Rust parity gate. `npm test`, `actuation verify`, the Skills check and the
# research suites already run in native-cli.yml, native-skills.yml and
# ql-experiments.yml; they are not repeated here.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  migration-oracle:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Record exact source basis
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p migration-evidence
          git rev-parse HEAD > migration-evidence/source-commit.txt
      - name: Enforce frozen compatibility oracle (never recapture in a passing gate)
        shell: bash
        run: |
          set -euo pipefail
          node --test scripts/migration/check-recorder.mjs
          node scripts/migration/verify-corpus.mjs | tee migration-evidence/corpus-integrity.json
          node scripts/migration/parity.mjs | tee migration-evidence/pure-parity.json
          node scripts/migration/scenario-parity.mjs | tee migration-evidence/scenario-parity.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: actuation-migration-evidence-${{ github.sha }}
          path: migration-evidence/
          if-no-files-found: error
          retention-days: 30

  native-rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Native constitutional domain and executable parity
        shell: bash
        run: |
          bash scripts/migration/verify-native.sh native-evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: actuation-native-${{ runner.os }}-${{ github.sha }}
          path: native-evidence/
          if-no-files-found: error
          retention-days: 30
