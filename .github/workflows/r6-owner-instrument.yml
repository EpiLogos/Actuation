name: Native research QL owner instrument
on:
  pull_request:
  push:
    branches: [main, act-rust/r6-research-refoundation]
    paths:
      - experiments/ql-runtime/native-owner-instrument/**
      - .github/workflows/r6-owner-instrument.yml
permissions:
  contents: read
jobs:
  owner-instrument:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Build and verify exact owner-library consumer
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/owner-instrument"
          mkdir -p "$out"
          git rev-parse HEAD > "$out/actuation-revision.txt"
          git rev-parse HEAD^{tree} > "$out/actuation-tree.txt"
          cd experiments/ql-runtime/native-owner-instrument
          # Initial authoring resolves the lock for native API publication.
          # The reviewed lock will be committed before R6 acceptance.
          if [ ! -f Cargo.lock ]; then cargo generate-lockfile; fi
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked 2>&1 | tee "$out/tests.log"
          cargo build --locked
          cp Cargo.lock "$out/Cargo.lock"
          cargo metadata --locked --format-version 1 > "$out/dependency-metadata.json"
          cp target/debug/actuation-ql-owner-instrument "$out/"
          printf '%s\n' '{"operation":"vocabulary"}' | target/debug/actuation-ql-owner-instrument > "$out/vocabulary.json"
          printf '%s\n' '{"operation":"harmonic-snapshot","basis":"chromatic"}' | target/debug/actuation-ql-owner-instrument > "$out/harmonic-chromatic.json"
          printf '%s\n' '{"operation":"harmonic-snapshot","basis":"fifths"}' | target/debug/actuation-ql-owner-instrument > "$out/harmonic-fifths.json"
          cargo vendor --locked "$out/vendor" > "$out/vendor-config.toml"
          tar -C "$out" -czf "$out/vendor.tar.gz" vendor
          rm -rf "$out/vendor"
          python3 - "$out" <<'PY'
          import hashlib, json, pathlib, sys
          root = pathlib.Path(sys.argv[1])
          metadata = json.loads((root / 'dependency-metadata.json').read_text())
          pin = 'e753efc91f62b5b2af09e0a852c5063e366eccbe'
          for name in ('ql-core', 'ql-mef'):
              package = next(p for p in metadata['packages'] if p['name'] == name)
              assert package['source'].endswith('#' + pin), package['source']
          (root / 'SHA256SUMS').write_text(''.join(hashlib.sha256(p.read_bytes()).hexdigest() + '  ' + p.name + '\n' for p in sorted(root.iterdir()) if p.is_file()))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: actuation-ql-owner-instrument-${{ matrix.os }}
          path: ${{ runner.temp }}/owner-instrument/
          if-no-files-found: error
          retention-days: 30
