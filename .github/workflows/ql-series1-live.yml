name: QL Series 1 Live

# Owner-gated live-provider evidence collection, now through the native
# research harness (R11). The harness's law is unchanged: the model body is an
# explicit supplied process (one-shot JSON or sdk-jsonl RPC host); Actuation
# owns context, bounds, records and evidence, never provider selection.
# The FIRST live validation run collected by this workflow is an explicit
# owner-gated step; dispatching it asserts that owner decision.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Experiment ref to execute
        required: true
        default: main
        type: string
      task:
        description: Series 1 task id (from the frozen corpus)
        required: true
        default: S1-RESTRAINT-001
        type: string
      conditions:
        description: Comma-separated conditions (classic,ql-direct,ql-deep)
        required: true
        default: 'classic,ql-direct,ql-deep'
        type: string
      repetitions:
        description: Repetitions per condition (1 for exploratory human review)
        required: true
        default: '1'
        type: string
      max_steps:
        description: Identical recurrence budget for every matched condition
        required: true
        default: '16'
        type: string
      model:
        description: Model id recorded into the run evidence (identical across conditions)
        required: true
        default: glm-5.3-flash
        type: string
      body:
        description: |
          Supplied model body JSON: {"process":{program,args,cwd,environment,timeout_ms,output_limit},
          "configuration":{provider,model,...},"fixture_provider":false,"protocol":"one-shot-json",
          "session_timeout_ms":...}. Secrets must be passed as process environment by the
          dispatcher; they are redacted from records.

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  live-series1:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Checkout experiment ref
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable

      - name: Preflight the frozen corpus and execute the matched benchmark
        shell: bash
        env:
          BODY: ${{ inputs.body }}
        run: |
          set -euo pipefail
          mkdir -p series1-evidence
          cargo build --locked --release -p actuation-research
          python3 - <<'PY' > /dev/null
          import json, os
          body = json.loads(os.environ["BODY"])
          conditions = [c.strip() for c in "${{ inputs.conditions }}".split(",") if c.strip()]
          request = {
              "operation": "comparison.run",
              "trace_ref": "series1-live:" + "${{ github.run_id }}",
              "root": "series1-evidence/comparison",
              "repetitions": int("${{ inputs.repetitions }}"),
              "conditions": conditions,
              "run": {
                  "task_id": "${{ inputs.task }}",
                  "max_steps": int("${{ inputs.max_steps }}"),
                  "max_calls": 10000,
                  "body": body,
              },
              "basis": {
                  "host_id": "supplied-body",
                  "host_revision": "native-series1-body-v1",
                  "benchmark_revision": "series1-v0.1-human-review",
                  "runner_revision": "actuation-research " + "${{ github.sha }}"[:12],
                  "review_contract_revision": "ql-series1-review/0.1",
              },
          }
          json.dump(request, open("series1-evidence/request.json", "w"), indent=1)
          PY
          ./target/release/actuation-research --json < series1-evidence/request.json > series1-evidence/manifest.json
          python3 - <<'PY'
          import json, sys
          manifest = json.load(open("series1-evidence/manifest.json"))
          if manifest.get("schema") != "ql-series1-run/0.3":
              sys.exit("Series 1 run did not produce a run manifest: " + json.dumps(manifest)[:400])
          held = manifest.get("held_constants", {})
          print("determination:", manifest.get("determination"))
          print("held constants valid:", held.get("valid"))
          sys.exit(0 if held.get("valid") else 1)
          PY

      - name: Publish Series 1 human-review evidence
        uses: actions/upload-artifact@v4
        with:
          name: ql-series1-human-review-${{ github.run_id }}
          path: series1-evidence/*
          if-no-files-found: error
