name: QL Experiment Pydantic AI

on:
  push:
    branches: [main]
    paths:
      - 'experiments/ql-runtime/foundation/**'
      - 'experiments/ql-runtime/experiments/pydantic/**'
      - '.github/workflows/ql-experiment-pydantic.yml'
  pull_request:
    paths:
      - 'experiments/ql-runtime/foundation/**'
      - 'experiments/ql-runtime/experiments/pydantic/**'
      - '.github/workflows/ql-experiment-pydantic.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pydantic-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Foundation tests
        working-directory: experiments/ql-runtime/foundation
        run: npm test
      - name: Pydantic matched runtime smoke
        run: node experiments/ql-runtime/experiments/pydantic/run-smoke.mjs
