name: Serial source import
on:
  push:
    branches: [act-rust/r5-observation-adapters]
    paths: [.github/workflows/serial-authoring.yml]
permissions:
  contents: write
jobs:
  import-exact-source:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Admit the exact independently tested source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, hashlib, io, json, lzma, os, pathlib, subprocess
          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()
          root = pathlib.Path.cwd()
          basis = '80432d7dba7e8c909e8871352625df524e92cfc8'
          expected = '23935fe33be834719792548e9669baeb46c92d4d'
          digest = '4100ecb947998abfe2f65ca100c505c011ac7ca4cc27109b6d2425754115087e'
          parts = [f'.migration-source-r5/part-{n}.txt' for n in range(8)]
          workflow = '.github/workflows/serial-authoring.yml'
          transport = {*parts, workflow}
          subprocess.run(['git', 'merge-base', '--is-ancestor', basis, 'HEAD'], check=True)
          assert set(git('diff', '--name-only', basis, 'HEAD').splitlines()) == transport
          compressed = base64.b64decode(''.join(pathlib.Path(p).read_text() for p in parts), validate=True)
          assert hashlib.sha256(compressed).hexdigest() == 'ef632e35c143bab7858c5af188b385ef68c122aedc6ca6e72adbf16289d0a474'
          with lzma.LZMAFile(io.BytesIO(compressed)) as stream:
              raw = stream.read(12 * 1024 * 1024 + 1)
          assert len(raw) <= 12 * 1024 * 1024 and hashlib.sha256(raw).hexdigest() == digest
          source = json.loads(raw)
          assert source['schema'] == 'actuation.serial-authoring/v1'
          assert source['basis_revision'] == basis and source['expected_tree'] == expected
          assert len(source['changes']) == 35
          paths = set()
          for change in source['changes']:
              path = change['path']
              relative = pathlib.PurePosixPath(path)
              assert not relative.is_absolute() and '..' not in relative.parts and '.git' not in relative.parts
              assert str(relative) == path and path not in paths and path not in transport
              assert change['mode'] in ['100644', '100755']
              paths.add(path)
              target = root / path
              assert not target.is_symlink() and target.resolve().is_relative_to(root)
              previous = git('ls-tree', basis, '--', path)
              assert (previous.split()[2] if previous else None) == change['before_blob'], path
              if change['content'] is None:
                  target.unlink()
              else:
                  assert isinstance(change['content'], str)
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(change['content'].encode('utf-8'))
                  target.chmod(0o755 if change['mode'] == '100755' else 0o644)
          workflow_bytes = pathlib.Path(workflow).read_bytes()
          for path in transport:
              pathlib.Path(path).unlink()
          pathlib.Path('.migration-source-r5').rmdir()
          subprocess.run(['git', 'add', '--all', '--', *sorted(paths | transport)], check=True)
          assert git('write-tree') == expected, 'readable source must match the tested tree exactly'
          # The branch token cannot change workflows. Retain this exact workflow
          # for publication only; the connected API must remove it before review.
          pathlib.Path(workflow).write_bytes(workflow_bytes)
          subprocess.run(['git', 'add', '--', workflow], check=True)
          evidence = pathlib.Path(os.environ['RUNNER_TEMP']) / 'serial-source-evidence'
          evidence.mkdir()
          (evidence / 'source-import.json').write_text(json.dumps({
              'schema':'actuation.serial-source-receipt/v1', 'basis_revision':basis,
              'transport_revision':git('rev-parse','HEAD'), 'source_tree':expected,
              'source_payload_sha256':digest, 'evidence_class':'D',
              'standing':'exact authored candidate; not accepted main'
          }, indent=2) + '\n')
          PY
      - name: Verify native observation and unchanged product and research
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/serial-source-evidence"
          bash scripts/migration/verify-native.sh "$evidence/native"
          npm test | tee "$evidence/node-native-tests.log"
          node bin/actuation verify --json | tee "$evidence/node-verify.json"
          bash scripts/verify-native-skills.sh | tee "$evidence/native-skills.log"
          node scripts/migration/verify-corpus.mjs | tee "$evidence/corpus-integrity.json"
          node scripts/migration/parity.mjs | tee "$evidence/node-pure-parity.json"
          node scripts/migration/scenario-parity.mjs | tee "$evidence/node-scenario-parity.json"
          node --test experiments/ql-runtime/foundation/test/*.test.js experiments/ql-runtime/deep-ql/test/*.test.js experiments/ql-runtime/prime/test/*.test.mjs experiments/epistemic-cultivation/test/*.test.mjs | tee "$evidence/research-tests.log"
          python3 -m py_compile experiments/ql-runtime/prime/skills/ql-relational/src/ql_relational/__init__.py experiments/ql-runtime/comparison/series1/pydantic_bridge.py
      - name: Publish readable code on this same serial branch
        shell: bash
        run: |
          set -euo pipefail
          test ! -e .migration-source-r5
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m '[ACT-RUST R5] Publish verified native observation and adapter source'
          git push origin HEAD:refs/heads/act-rust/r5-observation-adapters
      - name: Preserve exact source and verification evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/serial-source-evidence"
          mkdir -p "$evidence"
          git rev-parse HEAD > "$evidence/source-commit.txt"
          git archive --format=tar.gz HEAD > "$evidence/source.tar.gz"
          git bundle create "$evidence/source.bundle" HEAD
          (cd "$evidence" && sha256sum source.tar.gz source.bundle > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: actuation-r5-source-${{ github.sha }}
          path: ${{ runner.temp }}/serial-source-evidence/
          if-no-files-found: error
          retention-days: 30
