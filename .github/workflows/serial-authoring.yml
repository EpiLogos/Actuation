name: Serial source import
on:
  pull_request:
permissions:
  contents: write
jobs:
  import-exact-source:
    if: github.head_ref == 'act-rust/r5-native-adapters' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Admit exactly the independently tested source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, hashlib, io, json, lzma, os, pathlib, subprocess
          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()
          root = pathlib.Path.cwd()
          basis = '0ac4bbb47cc37a7ac3c1db42b88a39ffd6bb5b30'
          expected_tree = '5dfe4fcfa3f8a4701251f73870ff04d04a51dca4'
          expected_hash = 'e7eca501123740ea1b01daa76c4bc5a08628134ff2e5a0e29fe2fda9742e7de2'
          header_path = 'scripts/migration/authoring-capsule.json'
          header = json.loads(pathlib.Path(header_path).read_text())
          assert header['schema'] == 'actuation.serial-authoring/v1'
          assert header['encoding'] == 'xz+base64'
          assert header['basis_revision'] == basis and header['sha256'] == expected_hash
          parts = [f'scripts/migration/authoring-{n}.txt' for n in range(6)]
          assert header['parts'] == parts
          transport = {header_path, '.github/workflows/serial-authoring.yml', *parts}
          assert git('rev-parse', 'HEAD^') == basis
          assert set(git('diff', '--name-only', basis, 'HEAD').splitlines()) == transport
          compressed = base64.b64decode(''.join(pathlib.Path(p).read_text() for p in parts), validate=True)
          with lzma.LZMAFile(io.BytesIO(compressed)) as stream:
              raw = stream.read(12 * 1024 * 1024 + 1)
          assert len(raw) <= 12 * 1024 * 1024
          assert hashlib.sha256(raw).hexdigest() == expected_hash
          source = json.loads(raw)
          assert source['schema'] == header['schema'] and source['basis_revision'] == basis
          assert source['expected_tree'] == expected_tree and len(source['changes']) == 32
          paths = set()
          for change in source['changes']:
              path = change['path']
              relative = pathlib.PurePosixPath(path)
              assert not relative.is_absolute() and '..' not in relative.parts and '.git' not in relative.parts
              assert str(relative) == path and path not in paths and path not in transport
              assert change['mode'] in ['100644', '100755']
              paths.add(path)
              target = root / path
              assert not target.is_symlink() and target.resolve().is_relative_to(root)
              previous = git('ls-tree', basis, '--', path)
              assert (previous.split()[2] if previous else None) == change['before_blob'], path
              if change['content'] is None:
                  target.unlink()
              else:
                  assert isinstance(change['content'], str)
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(change['content'].encode('utf-8'))
                  target.chmod(0o755 if change['mode'] == '100755' else 0o644)
          for path in transport:
              pathlib.Path(path).unlink()
          subprocess.run(['git', 'add', '--all', '--', *sorted(paths | transport)], check=True)
          assert git('write-tree') == expected_tree, 'readable source must be exactly the tested tree'
          evidence = pathlib.Path(os.environ['RUNNER_TEMP']) / 'serial-source-evidence'
          evidence.mkdir()
          (evidence / 'source-import.json').write_text(json.dumps({
              'schema': 'actuation.serial-source-receipt/v1', 'basis_revision': basis,
              'transport_revision': git('rev-parse', 'HEAD'), 'source_tree': expected_tree,
              'source_payload_sha256': expected_hash, 'evidence_class': 'D',
              'standing': 'exact authored candidate; not accepted main'
          }, indent=2) + '\n')
          PY
      - name: Verify native observations and unchanged original product
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/serial-source-evidence"
          bash scripts/migration/verify-native.sh "$evidence/native"
          npm test | tee "$evidence/node-native-tests.log"
          node scripts/migration/verify-corpus.mjs | tee "$evidence/corpus-integrity.json"
          node scripts/migration/parity.mjs | tee "$evidence/node-pure-parity.json"
          node scripts/migration/scenario-parity.mjs | tee "$evidence/node-scenario-parity.json"
          bash scripts/verify-native-skills.sh | tee "$evidence/native-skills.log"
          node --test experiments/ql-runtime/foundation/test/*.test.js experiments/ql-runtime/deep-ql/test/*.test.js experiments/ql-runtime/prime/test/*.test.mjs experiments/epistemic-cultivation/test/*.test.mjs | tee "$evidence/research-tests.log"
      - name: Preserve clean candidate and publish readable code on this same branch
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/serial-source-evidence"
          test "$(git write-tree)" = '5dfe4fcfa3f8a4701251f73870ff04d04a51dca4'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          candidate=$(git commit-tree 5dfe4fcfa3f8a4701251f73870ff04d04a51dca4 -p HEAD -m '[ACT-RUST R5] Exact tested clean native adapter source')
          git update-ref refs/serial/r5-candidate "$candidate"
          printf '%s\n' "$candidate" > "$evidence/source-commit.txt"
          git archive --format=tar.gz "$candidate" > "$evidence/source.tar.gz"
          git bundle create "$evidence/source.bundle" refs/serial/r5-candidate
          (cd "$evidence" && sha256sum source.tar.gz source.bundle > SHA256SUMS)
          # Keep this workflow byte-identical while publishing via contents-only token.
          # The connected repository API removes it before final read-only CI/merge.
          git checkout HEAD -- .github/workflows/serial-authoring.yml
          git commit -m '[ACT-RUST R5] Publish verified native observation and adapter source'
          git push origin HEAD:refs/heads/act-rust/r5-native-adapters
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: actuation-r5-source-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/serial-source-evidence/
          if-no-files-found: error
          retention-days: 30
