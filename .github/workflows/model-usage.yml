name: Model usage contract

on:
  pull_request:
    paths:
      - "contracts/model-usage.mjs"
      - "contracts/model-usage.test.mjs"
      - "contracts/model-usage-v1.schema.json"
      - "contracts/actuation-stream.mjs"
      - "contracts/actuation-stream-store.mjs"
      - "contracts/activity.mjs"
      - "cli/**"
      - "docs/ACTUATION-STREAM.md"
      - "docs/ACTIVITY.md"
      - ".github/workflows/model-usage.yml"
  push:
    branches: [main]
    paths:
      - "contracts/model-usage.mjs"
      - "contracts/model-usage.test.mjs"
      - "contracts/model-usage-v1.schema.json"
      - "contracts/actuation-stream.mjs"
      - "contracts/actuation-stream-store.mjs"
      - "contracts/activity.mjs"
      - "cli/**"
      - "docs/ACTUATION-STREAM.md"
      - "docs/ACTIVITY.md"
      - ".github/workflows/model-usage.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: node -e 'JSON.parse(require("fs").readFileSync("contracts/model-usage-v1.schema.json", "utf8"))'
