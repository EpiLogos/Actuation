name: R6 native authoring basis
on:
  push:
    branches: [act-rust/r6-research-refoundation]
    paths: [.github/workflows/r6-authoring-toolchain.yml]
permissions:
  contents: read
jobs:
  native-basis:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Verify accepted native substrate and export offline authoring basis
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/r6-authoring"
          mkdir -p "$out"
          rustc -Vv > "$out/rustc.txt"
          cargo -V > "$out/cargo.txt"
          cargo test --locked --workspace 2>&1 | tee "$out/accepted-native-tests.log"
          cargo vendor --locked "$RUNNER_TEMP/vendor" > "$out/vendor-config.toml"
          tar -C "$RUNNER_TEMP" -czf "$out/vendor.tar.gz" vendor
          sysroot="$(rustc --print sysroot)"
          tar -C "$sysroot" -czf "$out/toolchain.tar.gz" bin lib libexec
          git rev-parse HEAD > "$out/source-commit.txt"
          git rev-parse HEAD^{tree} > "$out/source-tree.txt"
          cd "$out"
          sha256sum toolchain.tar.gz vendor.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: actuation-r6-native-authoring-basis
          path: ${{ runner.temp }}/r6-authoring/
          if-no-files-found: error
          retention-days: 7
