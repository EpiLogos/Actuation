name: Model-bearing contract

on:
  pull_request:
    paths:
      - "contracts/**"
      - ".github/workflows/model-bearing-contract.yml"
  push:
    paths:
      - "contracts/**"
      - ".github/workflows/model-bearing-contract.yml"

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify model-bearing agency contract
        run: node --test contracts/model-bearing.test.mjs
