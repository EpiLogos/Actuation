name: Native research SDK boundaries
on:
  pull_request:
    paths:
      - 'experiments/native-research/adapters/**'
      - 'fixtures/research/specimens/**'
      - 'crates/actuation-research/**'
      - '.github/workflows/research-sdk.yml'
  push:
    branches: [main]
    paths:
      - 'experiments/native-research/adapters/**'
      - 'fixtures/research/specimens/**'
      - 'crates/actuation-research/**'
      - '.github/workflows/research-sdk.yml'
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native-sdk:
    strategy:
      fail-fast: false
      matrix:
        sdk: [pi, pydantic, dsh]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        if: matrix.sdk == 'pydantic'
        with:
          python-version: '3.12'
      - name: Exact source and evidence scope
        shell: bash
        run: |
          mkdir -p sdk-evidence
          git rev-parse HEAD > sdk-evidence/actuation-revision.txt
          printf '%s\n' 'D: native SDK ABI, controlled responses, no provider/P/M/H claim' > sdk-evidence/standing.txt
      # pi/dsh: recorded-fixture conformance since the R11 JavaScript
      # retirement. The fixtures were captured from the pinned specimens
      # (published pi-ai 0.84.1; deepseek-harness source at 47f9438…); the
      # suite asserts those pins and replays the recorded specimen shapes
      # through the Rust wire contract.
      - name: Assert recorded specimen conformance and pins
        if: matrix.sdk == 'pi' || matrix.sdk == 'dsh'
        shell: bash
        run: |
          cargo test --locked -p actuation-research --test specimen_conformance -- \
            "${{ matrix.sdk }}_" 2>&1 | tee sdk-evidence/test.log
      # pydantic: the specimen stays live — the retained Python adapter
      # executes the pinned pydantic-ai source with controlled model responses.
      - uses: actions/checkout@v4
        if: matrix.sdk == 'pydantic'
        with:
          repository: pydantic/pydantic-ai
          ref: 00db3a4b391eb9a46f3d6e704070bcf725121f75
          path: .sdk/pydantic-ai
          persist-credentials: false
      - name: Install source-pinned Pydantic ABI
        if: matrix.sdk == 'pydantic'
        run: |
          test "$(git -C .sdk/pydantic-ai rev-parse HEAD)" = 00db3a4b391eb9a46f3d6e704070bcf725121f75
          python -m pip install -e '.sdk/pydantic-ai/pydantic_graph'
          python -m pip install -e '.sdk/pydantic-ai/pydantic_ai_slim[openai]'
      - name: Execute actual SDK with controlled model responses
        if: matrix.sdk == 'pydantic'
        shell: bash
        run: |
          set -euo pipefail
          python experiments/native-research/adapters/test/pydantic_test.py 2>&1 | tee sdk-evidence/test.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-research-sdk-${{ matrix.sdk }}-${{ github.sha }}
          path: sdk-evidence/
          if-no-files-found: error
          retention-days: 30
