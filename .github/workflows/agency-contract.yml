name: Agency contract

on:
  pull_request:
    paths:
      - "contracts/agency.mjs"
      - "contracts/agency.test.mjs"
      - "contracts/agency-v1.schema.json"
      - "contracts/agency-actualisation.mjs"
      - "contracts/agency-actualisation-v1.schema.json"
      - "cli/agency-actualisation.test.mjs"
      - "cli/commands.mjs"
      - "cli/surface.mjs"
      - "skills/actuation-operation/SKILL.md"
      - ".github/workflows/agency-contract.yml"
  push:
    branches:
      - "main"
    paths:
      - "contracts/agency.mjs"
      - "contracts/agency.test.mjs"
      - "contracts/agency-v1.schema.json"
      - "contracts/agency-actualisation.mjs"
      - "contracts/agency-actualisation-v1.schema.json"
      - "cli/agency-actualisation.test.mjs"
      - "cli/commands.mjs"
      - "cli/surface.mjs"
      - "skills/actuation-operation/SKILL.md"
      - ".github/workflows/agency-contract.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: node -e 'JSON.parse(require("fs").readFileSync("contracts/agency-v1.schema.json", "utf8"))'
      - run: node -e 'JSON.parse(require("fs").readFileSync("contracts/agency-actualisation-v1.schema.json", "utf8"))'
