name: QL experiments

# The QL research families (classic/direct/deep over the frozen task corpus)
# are expressed and run by the native research harness since the R11
# JavaScript retirement. This check runs the harness's offline suites: the
# foundation runtime semantics, the matched-condition mechanics and the
# live-evidence parity proofs over the recorded 2026-09-13 runs.

on:
  pull_request:
    paths:
      - 'crates/actuation-research/**'
      - 'crates/actuation-runtime/**'
      - 'crates/actuation-core/**'
      - 'fixtures/research/**'
      - 'experiments/ql-runtime/**/*.json'
      - '.github/workflows/ql-experiments.yml'
  push:
    branches: [main]
    paths:
      - 'crates/actuation-research/**'
      - 'crates/actuation-runtime/**'
      - 'crates/actuation-core/**'
      - 'fixtures/research/**'
      - 'experiments/ql-runtime/**/*.json'
      - '.github/workflows/ql-experiments.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  baseline:
    name: native research baseline
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Foundation semantics, matched runs and live-evidence parity
        run: cargo test --locked -p actuation-research
