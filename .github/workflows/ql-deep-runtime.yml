name: QL Deep Runtime
on:
  push:
    branches: [main]
    paths:
      - 'crates/actuation-research/**'
      - 'fixtures/research/**'
      - 'experiments/ql-runtime/deep-ql/convergence/dry-runs.json'
      - 'experiments/ql-runtime/QL-PAIRING-SQUARES-CLARIFICATION-08-14-2026.md'
      - 'experiments/ql-runtime/TYPING-CORPUS-REVIEW-CLARIFICATION-08-14-2026.md'
      - '.github/workflows/ql-deep-runtime.yml'
      - '.github/workflows/ql-series1-live.yml'
  pull_request:
    paths:
      - 'crates/actuation-research/**'
      - 'fixtures/research/**'
      - 'experiments/ql-runtime/deep-ql/convergence/dry-runs.json'
      - 'experiments/ql-runtime/QL-PAIRING-SQUARES-CLARIFICATION-08-14-2026.md'
      - 'experiments/ql-runtime/TYPING-CORPUS-REVIEW-CLARIFICATION-08-14-2026.md'
      - '.github/workflows/ql-deep-runtime.yml'
      - '.github/workflows/ql-series1-live.yml'
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deep-ql:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Deep runtime readiness, conformance and structural Series 1 preflight
        run: cargo test --locked -p actuation-research
      - name: Verify Series 1 harness structure without claiming live evidence
        run: cargo test --locked -p actuation-research --test live_evidence_parity
