name: Native Skills

on:
  pull_request:
    paths:
      - "skills/**"
      - "scripts/verify-native-skills.sh"
      - "bin/actuation"
      - "cli/**"
      - "contracts/**"
      - "package.json"
      - ".github/workflows/native-skills.yml"
  push:
    branches: [main]
    paths:
      - "skills/**"
      - "scripts/verify-native-skills.sh"
      - "bin/actuation"
      - "cli/**"
      - "contracts/**"
      - "package.json"
      - ".github/workflows/native-skills.yml"

jobs:
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # verify-native-skills.sh checks structure AND truth: every path,
      # contract identifier and `actuation <command>` the Skills name must
      # exist in the repository and the served surface.
      - run: bash scripts/verify-native-skills.sh
      - run: npm test
