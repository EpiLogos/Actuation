name: Native Skills

on:
  pull_request:
    paths:
      - "skills/**"
      - "scripts/verify-native-skills.sh"
      - "crates/**"
      - "catalog/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/native-skills.yml"
  push:
    branches: [main]
    paths:
      - "skills/**"
      - "scripts/verify-native-skills.sh"
      - "crates/**"
      - "catalog/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/native-skills.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # verify-native-skills.sh checks structure AND truth: every path,
      # contract identifier and `actuation <command>` the Skills name must
      # exist in the repository and in the served executable.
      - run: bash scripts/verify-native-skills.sh
