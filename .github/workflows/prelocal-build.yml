name: Pre-local build

on:
  workflow_dispatch:
    inputs:
      resolve_libproc_lock:
        description: "Resolve the reviewed libproc673 material against exact7fda inputs"
        required: false
        type: boolean
        default: false
  pull_request:
    paths:
      - '.oi/product.json'
      - 'crates/**'
      - 'catalog/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'skills/**'
      - 'README.md'
      - 'docs/EPISTEMIC-CULTIVATION-AND-MODEL-INTERIOR-RESEARCH.md'
      - 'docs/MODEL-BEARING-AGENCY-RESEARCH-AND-MATERIALISATION.md'
      - '.github/workflows/prelocal-build.yml'
  push:
    branches: [main]
    paths:
      - '.oi/product.json'
      - 'crates/**'
      - 'catalog/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'skills/**'
      - 'README.md'
      - 'docs/EPISTEMIC-CULTIVATION-AND-MODEL-INTERIOR-RESEARCH.md'
      - 'docs/MODEL-BEARING-AGENCY-RESEARCH-AND-MATERIALISATION.md'
      - '.github/workflows/prelocal-build.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # Default-off dependency material generation in the existing native job.
      # Restore the actual old manifest/lock before every original locked check.
      - name: Resolve exact reviewed libproc material with native Cargo
        if: github.event_name == 'workflow_dispatch' && inputs.resolve_libproc_lock
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import shutil
          import stat
          import subprocess
          import sys
          import time
          import tomllib
          
          # These exact constants are supplied from the reviewed Source cohort when the
          # script is embedded in the existing workflow. No resolver output is authored.
          BASE_SOURCE = "7fda54c0c131c917eceb7f29ecb8ca9b46eb22d8"
          LIBPROC_SOURCE = "67354674ffa30e7181d484fc0fd74abb3d9baa63"
          EXPECTED_TREE_EXCEPT_WORKFLOW = "9d7e57c93e60a97e69181ad125310df3a56f2e7e7ed0037572e70c4bbe505b9c"
          EXPECTED_MANIFEST = "2a22ca2f244464e6c7355ec09dd77404edeafda7ab6ef221ebf3cb83e0233033"
          EXPECTED_LOCK = "bddf06085b6f9069f52a161789f07f7f5be3869ead08153ec01b3d45541e969e"
          EXPECTED_NEW_MANIFEST = "013ea56e0a5917302c80dd3f31794a4b7a50e97d3d3a49c67e428ea0917a9d23"
          WORKFLOW = ".github/workflows/prelocal-build.yml"
          MANIFEST = "crates/actuation-research/Cargo.toml"
          DEPENDENCY = (
              '\n[target.\'cfg(target_os = "macos")\'.dependencies]\n'
              'libproc = { git = "https://github.com/EpiLogos/libproc-rs", '
              'rev = "67354674ffa30e7181d484fc0fd74abb3d9baa63" }\n'
          )
          root = Path.cwd().resolve(strict=True)
          evidence = root / "libproc-lock-evidence"
          evidence.mkdir(exist_ok=False)
          root_before = root.stat()
          inputs = {}
          mutation_started = False
          primary = None
          secondary = []
          observations = {
              "schema": "actuation.native-cargo-material-resolution/v1",
              "base_source": BASE_SOURCE,
              "upstream_source": LIBPROC_SOURCE,
              "standing": "Generated dependency material; not a CompilerArtifact or native consumer pass",
              "commands": [],
              "restoration": {},
          }
          
          
          def digest(data):
              return hashlib.sha256(data).hexdigest()
          
          
          def write_json(name, value):
              (evidence / name).write_text(json.dumps(value, indent=2) + "\n")
          
          
          def error_fact(error):
              return {"type": type(error).__name__, "message": str(error),
                      "errno": getattr(error, "errno", None),
                      "returncode": getattr(error, "returncode", None)}
          
          
          def root_current():
              current = root.stat()
              if (current.st_dev, current.st_ino) != (root_before.st_dev, root_before.st_ino):
                  raise RuntimeError("Actual hosted checkout root changed")
          
          
          def read_material(path, limit=2 * 1024 * 1024):
              root_current()
              if path.parent.resolve(strict=True) != path.parent:
                  raise RuntimeError("Selected material parent was redirected")
              fd = os.open(path, os.O_RDONLY | os.O_NOFOLLOW | os.O_NONBLOCK)
              try:
                  before = os.fstat(fd)
                  if not stat.S_ISREG(before.st_mode) or before.st_uid != os.getuid() or before.st_nlink != 1:
                      raise RuntimeError("Selected hosted material is not an owned single-link regular file")
                  if before.st_size > limit:
                      raise RuntimeError("Selected hosted material exceeds its read allowance")
                  body = bytearray()
                  while True:
                      chunk = os.read(fd, min(65536, limit + 1 - len(body)))
                      if not chunk:
                          break
                      body.extend(chunk)
                      if len(body) > limit:
                          raise RuntimeError("Selected hosted material grew beyond its read allowance")
                  after = os.fstat(fd)
                  named = path.lstat()
                  basis = lambda m: (m.st_dev, m.st_ino, m.st_size, m.st_mode, m.st_mtime_ns, m.st_ctime_ns)
                  if basis(before) != basis(after) or basis(after) != basis(named):
                      raise RuntimeError("Held and named material changed during reading")
                  return bytes(body), {
                      "dev": after.st_dev, "ino": after.st_ino, "uid": after.st_uid,
                      "mode": stat.S_IMODE(after.st_mode), "nlink": after.st_nlink,
                      "bytes": len(body), "sha256": digest(body),
                  }
              finally:
                  os.close(fd)
          
          
          def restore_material(relative, body, mode):
              path = root / relative
              root_current()
              if path.parent.resolve(strict=True) != path.parent:
                  raise RuntimeError("Restoration parent was redirected")
              fd = os.open(path, os.O_WRONLY | os.O_CREAT | os.O_NOFOLLOW | os.O_NONBLOCK, mode)
              try:
                  held = os.fstat(fd)
                  if not stat.S_ISREG(held.st_mode) or held.st_uid != os.getuid() or held.st_nlink != 1:
                      raise RuntimeError("Restoration target is not an owned single-link regular file")
                  os.ftruncate(fd, 0)
                  view = memoryview(body)
                  while view:
                      count = os.write(fd, view)
                      if count <= 0:
                          raise OSError("Restoration write made no progress")
                      view = view[count:]
                  os.fchmod(fd, mode)
                  os.fsync(fd)
              finally:
                  os.close(fd)
              observed, basis = read_material(path)
              if observed != body or basis["mode"] != mode:
                  raise RuntimeError("Actual restoration bytes or mode differ")
              return basis
          
          
          def raw(label, argv, deadline=180):
              start = time.monotonic()
              timeout = shutil.which("timeout")
              if timeout is None:
                  raise FileNotFoundError("Existing Linux timeout utility is required")
              command = [timeout, "--signal=TERM", "--kill-after=5s", f"{deadline}s", *argv]
              with (evidence / (label + ".stdout")).open("xb") as out, (evidence / (label + ".stderr")).open("xb") as err:
                  result = subprocess.run(command, stdout=out, stderr=err, check=False)
              (evidence / (label + ".exit")).write_text(str(result.returncode) + "\n")
              row = {"label": label, "argv": argv, "deadline_seconds": deadline,
                     "timeout_command": command, "exit": result.returncode,
                     "elapsed_seconds": time.monotonic() - start,
                     "stdout_bytes": (evidence / (label + ".stdout")).stat().st_size,
                     "stderr_bytes": (evidence / (label + ".stderr")).stat().st_size}
              observations["commands"].append(row)
              if result.returncode != 0:
                  raise RuntimeError(f"Actual {label} returned {result.returncode}; retained raw output")
              if (evidence / (label + ".stdout")).stat().st_size > 16 * 1024 * 1024:
                  raise RuntimeError(f"Actual {label} stdout exceeds metadata read allowance; raw file retained")
              return (evidence / (label + ".stdout")).read_bytes()
          
          
          def tree_fingerprint():
              entries = subprocess.check_output(["git", "ls-tree", "-r", "-z", "HEAD"]).split(b"\0")
              return digest(b"\0".join(e for e in entries if e and e.split(b"\t", 1)[1].decode() != WORKFLOW) + b"\0")
          
          
          def package_key(package):
              return (package["name"], package["version"], package.get("source"))
          
          
          try:
              if tree_fingerprint() != EXPECTED_TREE_EXCEPT_WORKFLOW:
                  raise RuntimeError("Native owner Source differs from reviewed7fda outside this workflow")
              head = subprocess.check_output(["git", "rev-parse", "HEAD"]).decode().strip()
              if head != os.environ["GITHUB_SHA"]:
                  raise RuntimeError("Actual dispatch checkout differs from requested workflow Source")
              if subprocess.check_output(["git", "status", "--porcelain", "--untracked-files=no"]):
                  raise RuntimeError("Actual native input checkout is already modified")
              observations.update({"actual_source": head, "tree": subprocess.check_output(["git", "rev-parse", "HEAD^{tree}"]).decode().strip(),
                                   "workflow_ref": os.environ.get("GITHUB_WORKFLOW_REF"),
                                   "workflow_sha": os.environ.get("GITHUB_WORKFLOW_SHA"),
                                   "runner_os": os.environ.get("RUNNER_OS"), "root": str(root),
                                   "root_dev": root_before.st_dev, "root_ino": root_before.st_ino,
                                   "uid": os.getuid(), "tree_except_workflow": tree_fingerprint()})
              for relative, expected in [(MANIFEST, EXPECTED_MANIFEST), ("Cargo.lock", EXPECTED_LOCK)]:
                  body, basis = read_material(root / relative)
                  if digest(body) != expected:
                      raise RuntimeError("Selected actual manifest or lock differs from reviewed Source")
                  inputs[relative] = (body, basis)
                  (evidence / ("before-" + Path(relative).name)).write_bytes(body)
              write_json("input-basis.json", {relative: basis for relative, (_, basis) in inputs.items()})
              with (evidence / "input-source.tar").open("xb") as archive:
                  subprocess.run(["git", "archive", "--format=tar", "HEAD"], stdout=archive, check=True, timeout=30)
              (evidence / "input-source-modes.txt").write_bytes(subprocess.check_output(["git", "ls-tree", "-r", "HEAD"]))
              raw("cargo-version", ["cargo", "-V"], 10)
              raw("rust-version", ["rustc", "-Vv"], 10)
              raw("host-version", ["uname", "-a"], 10)
              tools = {}
              for name in ("cargo", "rustc"):
                  selected_tool = Path(raw(name + "-selected-tool", ["rustup", "which", name], 10).decode().strip()).resolve(strict=True)
                  before = selected_tool.stat()
                  if not stat.S_ISREG(before.st_mode):
                      raise RuntimeError("Actual native tool is not regular")
                  h = hashlib.sha256()
                  with selected_tool.open("rb") as stream:
                      while chunk := stream.read(65536):
                          h.update(chunk)
                  after = selected_tool.stat()
                  basis = lambda m: (m.st_dev, m.st_ino, m.st_size, m.st_mtime_ns, m.st_ctime_ns)
                  if basis(before) != basis(after):
                      raise RuntimeError("Actual native tool changed while observing its image")
                  tools[name] = {"requested_path": shutil.which(name), "selected_path": str(selected_tool),
                                 "sha256": h.hexdigest(), "bytes": after.st_size,
                                 "mode": stat.S_IMODE(after.st_mode), "dev": after.st_dev,
                                 "ino": after.st_ino, "uid": after.st_uid,
                                 "standing": "Read-only installed tool basis; not a solver-produced CompilerArtifact"}
              write_json("native-tool-basis.json", tools)
              before_lock = tomllib.loads(inputs["Cargo.lock"][0].decode())
              package = next(p for p in before_lock["package"] if p["name"] == "actuation-research")
              if package["version"] != "0.2.1" or package.get("source") is not None:
                  raise RuntimeError("Changed manifest package identity is not the admitted native workspace member")
              proposed = inputs[MANIFEST][0] + DEPENDENCY.encode()
              if digest(proposed) != EXPECTED_NEW_MANIFEST:
                  raise RuntimeError("Proposed target manifest differs from reviewed afterimage")
              mutation_started = True
              restore_material(MANIFEST, proposed, inputs[MANIFEST][1]["mode"])
              (evidence / "proposed-Cargo.toml").write_bytes(proposed)
              raw("solver", ["cargo", "update", "--package", "actuation-research@0.2.1", "--manifest-path", "Cargo.toml", "--color", "never"])
              lock, lock_basis = read_material(root / "Cargo.lock")
              (evidence / "generated-Cargo.lock").write_bytes(lock)
              observations["generated_lock_basis"] = lock_basis
              raw("lock-diff", ["git", "diff", "--", "Cargo.lock", MANIFEST], 10)
              after_lock = tomllib.loads(lock.decode())
              if {k: v for k, v in after_lock.items() if k != "package"} != {
                  k: v for k, v in before_lock.items() if k != "package"
              }:
                  raise RuntimeError("Actual lock metadata changed beyond the admitted dependency")
              old = {package_key(p): p for p in before_lock["package"]}
              new = {package_key(p): p for p in after_lock["package"]}
              if len(old) != len(before_lock["package"]) or len(new) != len(after_lock["package"]):
                  raise RuntimeError("Duplicate actual package identities")
              changed_key = package_key(package)
              for key, original in old.items():
                  if key != changed_key and new.get(key) != original:
                      raise RuntimeError(f"Unrelated original package changed: {key}")
              revised = new[changed_key]
              unchanged_fields = {k: v for k, v in revised.items() if k != "dependencies"}
              if unchanged_fields != {k: v for k, v in package.items() if k != "dependencies"}:
                  raise RuntimeError("Native workspace package metadata changed")
              if sorted(revised.get("dependencies", [])) != sorted([*package.get("dependencies", []), "libproc"]):
                  raise RuntimeError("Native workspace dependency change exceeds the selected libproc edge")
              libproc_source = f"git+https://github.com/EpiLogos/libproc-rs?rev={LIBPROC_SOURCE}#{LIBPROC_SOURCE}"
              libproc_key = ("libproc", "0.14.11", libproc_source)
              if libproc_key not in new:
                  raise RuntimeError("Actual generated libproc identity is not the published reviewed source")
              closure = set()
              pending = [libproc_key]
              while pending:
                  key = pending.pop()
                  if key in closure:
                      continue
                  closure.add(key)
                  for dependency in new[key].get("dependencies", []):
                      fields = dependency.split(" ", 2)
                      candidates = [k for k in new if k[0] == fields[0]
                                    and (len(fields) < 2 or k[1] == fields[1])
                                    and (len(fields) < 3 or k[2] == fields[2].removeprefix("(").removesuffix(")"))]
                      if len(candidates) != 1:
                          raise RuntimeError("Actual generated dependency graph edge is ambiguous")
                      pending.append(candidates[0])
              if not (set(new) - set(old)).issubset(closure):
                  raise RuntimeError("Solver added packages outside the selected libproc dependency closure")
              observations["new_package_identities"] = sorted(set(new) - set(old))
              metadata = json.loads(raw("metadata", ["cargo", "metadata", "--locked", "--format-version", "1"]))
              selected = [p for p in metadata["packages"] if p["name"] == "libproc" and p["source"] == libproc_source]
              if len(selected) != 1 or selected[0]["version"] != "0.14.11" or selected[0]["rust_version"] not in ("1.85", "1.85.0"):
                  raise RuntimeError("Actual Cargo selected package contract differs")
              upstream = Path(selected[0]["manifest_path"]).parent.resolve(strict=True)
              if subprocess.check_output(["git", "-C", str(upstream), "rev-parse", "HEAD"]).decode().strip() != LIBPROC_SOURCE:
                  raise RuntimeError("Actual Cargo checkout does not match the required contributor commit")
              if subprocess.check_output(["git", "-C", str(upstream), "status", "--porcelain", "--untracked-files=no"]):
                  raise RuntimeError("Actual Cargo upstream package Source is modified")
              with (evidence / "upstream-source.tar").open("xb") as archive:
                  subprocess.run(["git", "-C", str(upstream), "archive", "--format=tar", "HEAD"], stdout=archive, check=True, timeout=30)
              (evidence / "upstream-source-modes.txt").write_bytes(subprocess.check_output(["git", "-C", str(upstream), "ls-tree", "-r", "HEAD"]))
          except Exception as error:
              primary = error_fact(error)
          finally:
              if mutation_started:
                  # Retain real output even when Cargo failed before a valid generated
                  # lock existed. Unknown/absent/changed material remains an actual cause.
                  for relative in inputs:
                      try:
                          actual, basis = read_material(root / relative)
                          (evidence / ("before-restore-" + Path(relative).name)).write_bytes(actual)
                          observations.setdefault("before_restore", {})[relative] = basis
                      except Exception as error:
                          secondary.append({"phase": "before-restore-reading", "path": relative,
                                            **error_fact(error)})
                  for relative, (body, basis) in inputs.items():
                      try:
                          observations["restoration"][relative] = restore_material(relative, body, basis["mode"])
                      except Exception as error:
                          secondary.append({"phase": "restore", "path": relative, **error_fact(error)})
              try:
                  if subprocess.check_output(["git", "diff", "--exit-code"]):
                      raise RuntimeError("Actual tracked native files differ from Source after restoration")
                  if subprocess.check_output(["git", "diff", "--cached", "--exit-code"]):
                      raise RuntimeError("Actual native checkout index changed during resolution")
                  if tree_fingerprint() != EXPECTED_TREE_EXCEPT_WORKFLOW:
                      raise RuntimeError("Native owner Source changed during the solver operation")
              except Exception as error:
                  secondary.append({"phase": "after-source", **error_fact(error)})
              inventory = []
              for path in sorted(evidence.iterdir()):
                  if not path.is_file() or path.is_symlink():
                      raise RuntimeError("Unexpected upload material form")
                  size = path.stat().st_size
                  h = hashlib.sha256()
                  with path.open("rb") as stream:
                      while chunk := stream.read(65536):
                          h.update(chunk)
                  inventory.append({"path": path.name, "bytes": size, "sha256": h.hexdigest(),
                                    "mode": stat.S_IMODE(path.stat().st_mode)})
              write_json("material-inventory.json", inventory)
              observations.update({"primary_failure": primary, "secondary_failures": secondary,
                                   "solver_material_admitted": primary is None and not secondary,
                                   "compiled_consumer": False, "native_consumer_test_passes": 0})
              write_json("result.json", observations)
              print(json.dumps({"solver_material_admitted": observations["solver_material_admitted"],
                                "primary_failure": primary, "secondary_failures": secondary,
                                "compiled_consumer": False}))
          if primary is not None or secondary:
              sys.exit(1)
          PY
      - name: Retain actual solver inputs, raw failure and generated material
        if: always() && github.event_name == 'workflow_dispatch' && inputs.resolve_libproc_lock
        uses: actions/upload-artifact@v4
        with:
          name: actuation-libproc-lock-material-${{ github.sha }}
          path: libproc-lock-evidence/
          if-no-files-found: error
          retention-days: 30
      - name: Build the release executable
        run: cargo build --release --locked -p actuation-cli
      - name: Serve the packaged artifact in a clean directory and verify it
        # Completeness, not just correctness: the served binary must run and
        # certify itself from a bare directory — no repository, no Node, no
        # source checkout — because that is how it is installed.
        shell: bash
        run: |
          set -euo pipefail
          version="$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json,sys; print([p for p in json.load(sys.stdin)["packages"] if p["name"]=="actuation-cli"][0]["version"])')"
          serve="$(mktemp -d)"
          cp target/release/actuation "$serve/"
          test "$("$serve/actuation" --version)" = "actuation $version"
          "$serve/actuation" verify --json

  artifact:
    if: github.event_name == 'push'
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            platform: macos-arm64
          - os: ubuntu-22.04
            platform: linux-x86_64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build the release executable for ${{ matrix.platform }}
        run: cargo build --release --locked -p actuation-cli
      - name: Package the platform artifact
        shell: bash
        run: |
          set -euo pipefail
          short_sha="${GITHUB_SHA::12}"
          version="$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json,sys; print([p for p in json.load(sys.stdin)["packages"] if p["name"]=="actuation-cli"][0]["version"])')"
          name="actuation-${version}-${short_sha}-${{ matrix.platform }}"
          mkdir -p "dist/$name"
          cp target/release/actuation "dist/$name/actuation"
          printf '%s\n' "$GITHUB_SHA" > "dist/$name/source-commit.txt"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "dist/$name.tar.gz" > "dist/$name.tar.gz.sha256"
          else
            shasum -a 256 "dist/$name.tar.gz" > "dist/$name.tar.gz.sha256"
          fi
      - name: Serve the packaged artifact in a clean directory and verify it
        shell: bash
        run: |
          set -euo pipefail
          short_sha="${GITHUB_SHA::12}"
          version="$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json,sys; print([p for p in json.load(sys.stdin)["packages"] if p["name"]=="actuation-cli"][0]["version"])')"
          name="actuation-${version}-${short_sha}-${{ matrix.platform }}"
          serve="$(mktemp -d)"
          tar -C "$serve" -xzf "dist/$name.tar.gz"
          test "$(cat "$serve/$name/source-commit.txt")" = "$GITHUB_SHA"
          test "$("$serve/$name/actuation" --version)" = "actuation $version"
          "$serve/$name/actuation" verify --json
      - uses: actions/attest@v4
        with:
          subject-path: dist/*.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: actuation-${{ matrix.platform }}-${{ github.sha }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
