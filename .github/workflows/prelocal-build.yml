name: Pre-local build

on:
  pull_request:
    paths:
      - '.oi/product.json'
      - 'crates/**'
      - 'catalog/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'skills/**'
      - 'README.md'
      - 'docs/EPISTEMIC-CULTIVATION-AND-MODEL-INTERIOR-RESEARCH.md'
      - 'docs/MODEL-BEARING-AGENCY-RESEARCH-AND-MATERIALISATION.md'
      - 'experiments/epistemic-cultivation/**'
      - '.github/workflows/prelocal-build.yml'
  push:
    branches: [main]
    paths:
      - '.oi/product.json'
      - 'crates/**'
      - 'catalog/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'skills/**'
      - 'README.md'
      - 'docs/EPISTEMIC-CULTIVATION-AND-MODEL-INTERIOR-RESEARCH.md'
      - 'docs/MODEL-BEARING-AGENCY-RESEARCH-AND-MATERIALISATION.md'
      - 'experiments/epistemic-cultivation/**'
      - '.github/workflows/prelocal-build.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build the release executable
        run: cargo build --release --locked -p actuation-cli
      - name: Serve the packaged artifact in a clean directory and verify it
        # Completeness, not just correctness: the served binary must run and
        # certify itself from a bare directory — no repository, no Node, no
        # source checkout — because that is how it is installed.
        shell: bash
        run: |
          set -euo pipefail
          version="$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json,sys; print([p for p in json.load(sys.stdin)["packages"] if p["name"]=="actuation-cli"][0]["version"])')"
          serve="$(mktemp -d)"
          cp target/release/actuation "$serve/"
          test "$("$serve/actuation" --version)" = "actuation $version"
          "$serve/actuation" verify --json

  artifact:
    if: github.event_name == 'push'
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            platform: macos-arm64
          - os: ubuntu-22.04
            platform: linux-x86_64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build the release executable for ${{ matrix.platform }}
        run: cargo build --release --locked -p actuation-cli
      - name: Package the platform artifact
        shell: bash
        run: |
          set -euo pipefail
          short_sha="${GITHUB_SHA::12}"
          version="$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json,sys; print([p for p in json.load(sys.stdin)["packages"] if p["name"]=="actuation-cli"][0]["version"])')"
          name="actuation-${version}-${short_sha}-${{ matrix.platform }}"
          mkdir -p "dist/$name"
          cp target/release/actuation "dist/$name/actuation"
          printf '%s\n' "$GITHUB_SHA" > "dist/$name/source-commit.txt"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "dist/$name.tar.gz" > "dist/$name.tar.gz.sha256"
          else
            shasum -a 256 "dist/$name.tar.gz" > "dist/$name.tar.gz.sha256"
          fi
      - name: Serve the packaged artifact in a clean directory and verify it
        shell: bash
        run: |
          set -euo pipefail
          short_sha="${GITHUB_SHA::12}"
          version="$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json,sys; print([p for p in json.load(sys.stdin)["packages"] if p["name"]=="actuation-cli"][0]["version"])')"
          name="actuation-${version}-${short_sha}-${{ matrix.platform }}"
          serve="$(mktemp -d)"
          tar -C "$serve" -xzf "dist/$name.tar.gz"
          test "$(cat "$serve/$name/source-commit.txt")" = "$GITHUB_SHA"
          test "$("$serve/$name/actuation" --version)" = "actuation $version"
          "$serve/$name/actuation" verify --json
      - uses: actions/attest@v4
        with:
          subject-path: dist/*.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: actuation-${{ matrix.platform }}-${{ github.sha }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
