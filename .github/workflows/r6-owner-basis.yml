name: R6 QL owner basis
on:
  push:
    branches: [act-rust/r6-research-refoundation]
    paths: [.github/workflows/r6-owner-basis.yml]
permissions:
  contents: read
jobs:
  exact-ql-owner:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: dtolnay/rust-toolchain@stable
      - name: Retrieve exact accepted formal owner and build its native operations
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/r6-ql-owner"
          cd "$RUNNER_TEMP"
          git clone https://github.com/EpiLogos/QL-MEF.git ql-owner
          cd ql-owner
          git checkout --detach e753efc91f62b5b2af09e0a852c5063e366eccbe
          git rev-parse HEAD > "$RUNNER_TEMP/r6-ql-owner/revision.txt"
          git rev-parse HEAD^{tree} > "$RUNNER_TEMP/r6-ql-owner/tree.txt"
          git bundle create "$RUNNER_TEMP/r6-ql-owner/source.bundle" HEAD
          git archive --format=tar.gz HEAD > "$RUNNER_TEMP/r6-ql-owner/source.tar.gz"
          cargo build --locked --workspace --bins 2>&1 | tee "$RUNNER_TEMP/r6-ql-owner/build.log"
          cargo test --locked -p ql-core -p ql-service -p ql-cli 2>&1 | tee "$RUNNER_TEMP/r6-ql-owner/tests.log"
          mkdir "$RUNNER_TEMP/r6-ql-owner/bin"
          for f in target/debug/ql*; do
            if [ -f "$f" ] && [ -x "$f" ]; then cp "$f" "$RUNNER_TEMP/r6-ql-owner/bin/"; fi
          done
          cargo vendor --locked "$RUNNER_TEMP/r6-ql-owner/vendor" > "$RUNNER_TEMP/r6-ql-owner/vendor-config.toml"
          tar -C "$RUNNER_TEMP/r6-ql-owner" -czf "$RUNNER_TEMP/r6-ql-owner/vendor.tar.gz" vendor
          rm -rf "$RUNNER_TEMP/r6-ql-owner/vendor"
          target/debug/ql --version > "$RUNNER_TEMP/r6-ql-owner/version.txt"
          target/debug/ql help > "$RUNNER_TEMP/r6-ql-owner/help.txt"
          target/debug/ql capabilities --json > "$RUNNER_TEMP/r6-ql-owner/capabilities.json"
          cd "$RUNNER_TEMP/r6-ql-owner"
          sha256sum source.bundle source.tar.gz vendor.tar.gz bin/* > SHA256SUMS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: actuation-r6-ql-owner-e753efc9
          path: ${{ runner.temp }}/r6-ql-owner/
          if-no-files-found: error
          retention-days: 30
