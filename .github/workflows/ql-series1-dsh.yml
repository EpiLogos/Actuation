name: QL Series 1 DSH

# Since the R11 JavaScript retirement the pinned DeepSeek Harness guarantee is
# carried by recorded-fixture conformance: fixtures captured from the public
# source at the pinned revision (usage mapping, observational-agent law,
# session/inspection separation) are asserted by the native suite. Re-capture
# is an owner-run procedure documented in docs/rust-refoundation/
# R11-JS-RETIREMENT.md; a pin bump without re-capture fails the pin assertions.

on:
  push:
    branches: [main]
    paths:
      - 'fixtures/research/specimens/**'
      - 'crates/actuation-research/**'
      - '.github/workflows/ql-series1-dsh.yml'
  pull_request:
    paths:
      - 'fixtures/research/specimens/**'
      - 'crates/actuation-research/**'
      - '.github/workflows/ql-series1-dsh.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  structural:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Pinned DSH specimen conformance (recorded fixture, pins asserted)
        run: cargo test --locked -p actuation-research --test specimen_conformance
