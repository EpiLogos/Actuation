[package]
name = "actuation-research"
version.workspace = true
edition.workspace = true
publish.workspace = true
repository.workspace = true

[dependencies]
actuation-core = { path = "../actuation-core" }
actuation-runtime = { path = "../actuation-runtime" }
actuation-stream = { path = "../actuation-stream" }
serde.workspace = true
serde_json = { workspace = true, features = ["float_roundtrip"] }
sha2 = "0.10"
regex = "1"
tempfile = "3"
rustix = { version = "1", features = ["fs", "process"] }
libc = "0.2"

[lints]
workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
libproc = { git = "https://github.com/EpiLogos/libproc-rs", rev = "67354674ffa30e7181d484fc0fd74abb3d9baa63" }
